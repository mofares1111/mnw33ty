<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة إنشاء الأسئلة</title>

    <!-- استيراد مكتبات Firebase (السكربتات الأساسية) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // ⚠️ ضع إعدادات مشروعك في Firebase هنا حصراً
        const firebaseConfig = {
            apiKey: "AIzaSyDV_ZBiUzFwfixfGGWrv0b5HsJOAxUKgbk",
            authDomain: "questionwriter-d115b.firebaseapp.com",
            projectId: "questionwriter-d115b",
            storageBucket: "questionwriter-d115b.firebasestorage.app",
            messagingSenderId: "160392577098",
            appId: "1:160392577098:web:98c65ef9bf81a44cc526b3"
        };

        // تهيئة فايربيس
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // ربط الدوال بالمتصفح لكي تعمل مع الأزرار onclick
        window.auth = auth;
        window.db = db;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.updateProfile = updateProfile;
        window.doc = doc;
        window.setDoc = setDoc;
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f1f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 18px;
            padding: 35px 30px;
            box-shadow: 0 10px 35px rgba(0,0,0,0.12);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 15px;
            border-radius: 18px;
            background: #2563eb;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            color: #222;
            font-size: 25px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 48px;
            border: 1px solid #d5d9df;
            border-radius: 10px;
            padding: 0 14px;
            font-size: 15px;
            outline: none;
            direction: rtl;
        }

        input:focus {
            border-color: #2563eb;
        }

        .login-btn {
            width: 100%;
            height: 50px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .register {
            text-align: center;
            margin-top: 22px;
            color: #777;
            font-size: 14px;
        }

        .register a {
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .register-form {
            display: none;
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        .message {
            display: none;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 14px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- واجهة تسجيل الدخول -->
        <div id="loginForm">
            <div class="logo">س</div>
            <h1>منصة إنشاء الأسئلة</h1>
            <p class="subtitle">أنشئ امتحاناتك وأسئلتك بسهولة</p>

            <div id="loginMessage" class="message"></div>

            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="loginEmail" placeholder="أدخل البريد الإلكتروني">
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور">
            </div>

            <button class="login-btn" onclick="login()">تسجيل الدخول</button>

            <div class="register">
                ليس لديك حساب؟
                <a onclick="showRegister()">إنشاء حساب</a>
            </div>
        </div>


        <!-- واجهة إنشاء حساب -->
        <div id="registerForm" class="register-form">
            <div class="logo">+</div>
            <h1>إنشاء حساب</h1>
            <p class="subtitle">أنشئ حسابك للبدء باستخدام المنصة</p>

            <div id="registerMessage" class="message"></div>

            <div class="input-group">
                <label>الاسم</label>
                <input type="text" id="registerName" placeholder="أدخل اسمك">
            </div>

            <div class="input-group">
                <label>البريد الإلكتروني</label>
                <input type="email" id="registerEmail" placeholder="أدخل البريد الإلكتروني">
            </div>

            <div class="input-group">
                <label>كلمة المرور</label>
                <input type="password" id="registerPassword" placeholder="أدخل كلمة المرور">
            </div>

            <button class="login-btn" onclick="register()">إنشاء الحساب</button>

            <div class="back-login" onclick="showLogin()">
                ← العودة إلى تسجيل الدخول
            </div>
        </div>

        <div class="footer">
            منصة تعليمية لإنشاء وتنظيم الأسئلة
        </div>

    </div>


    <!-- سكربتات تشغيل التطبيق (جافاسكريبت) -->
    <script>
        function showRegister() {
            document.getElementById("loginForm").style.display = "none";
            document.getElementById("registerForm").style.display = "block";
        }

        function showLogin() {
            document.getElementById("registerForm").style.display = "none";
            document.getElementById("loginForm").style.display = "block";
        }

        async function login() {
            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;
            const message = document.getElementById("loginMessage");

            if (!email || !password) {
                message.innerHTML = "يرجى ملء جميع الحقول";
                message.className = "message error";
                message.style.display = "block";
                return;
            }

            try {
                // تسجيل الدخول عبر فايربيس
                const userCredential = await signInWithEmailAndPassword(window.auth, email, password);

                message.innerHTML = "تم تسجيل الدخول بنجاح، جاري تحويلك...";
                message.className = "message success";
                message.style.display = "block";

                // الانتقال التلقائي إلى صفحة الأدمن (تأكد أن اسم الملف مطابق تماماً لمجلد المشروع)
                setTimeout(() => {
                    window.location.href = "admin.html"; // إذا كان اسم ملفك مختلفاً، غيره هنا (مثل dashboard.html)
                }, 1000);

            } catch (error) {
                console.log("رمز الخطأ:", error.code);
                console.log("تفاصيل الخطأ:", error.message);

                message.innerHTML = "خطأ: " + error.code;
                message.className = "message error";
                message.style.display = "block";
            }
        }

        async function register() {
            const name = document.getElementById("registerName").value.trim();
            const email = document.getElementById("registerEmail").value.trim();
            const password = document.getElementById("registerPassword").value;
            const message = document.getElementById("registerMessage");

            if (!name || !email || !password) {
                message.innerHTML = "يرجى ملء جميع الحقول";
                message.className = "message error";
                message.style.display = "block";
                return;
            }

            if (password.length < 6) {
                message.innerHTML = "كلمة المرور يجب أن تكون 6 أحرف على الأقل";
                message.className = "message error";
                message.style.display = "block";
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(window.auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });

                await setDoc(doc(window.db, "users", userCredential.user.uid), {
                    name: name,
                    email: email,
                    role: "user",
                    createdAt: new Date().toISOString()
                });

                message.innerHTML = "تم إنشاء الحساب بنجاح";
                message.className = "message success";
                message.style.display = "block";

            } catch (error) {
                message.innerHTML = "حدث خطأ: " + error.message;
                message.className = "message error";
                message.style.display = "block";
            }
        }
    </script>

</body>
</html>
